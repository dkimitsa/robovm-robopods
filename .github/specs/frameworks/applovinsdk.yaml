name: applovinsdk
moduleFolder: applovinsdk
artifactSource: 
  - to get last version tag use https://github.com/AppLovin/AppLovin-MAX-Swift-Package/releases/latest
  - check `Package.swift` from corresponding version tag to get `.binaryTarget` url for the zip file
  - download the zip into a temporary/empty staging folder (NOT directly into downloadLocation)
  - extract it and move AppLovinSDK.xcframework to downloadLocation
  - result check - the folder ./.robopods-wip/AppLovinSDK.xcframework/ must exist
downloadLocation: ./.robopods-wip/AppLovinSDK.xcframework
