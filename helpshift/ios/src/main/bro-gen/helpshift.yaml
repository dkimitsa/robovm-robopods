package: org.robovm.pods.helpshift
include: [foundation, uikit, usernotifications]
clang_args: ['-x', 'objective-c']
framework: HelpshiftX
headers:
    - HelpshiftX.h

private_typedefs: {}

typedefs: {}

enums:
    HelpshiftAuthenticationFailureReason: {}
classes:
    Helpshift:
        methods:
            '+installWithPlatformId:domain:config:':
                name: install
            '+showConversationWith:config:':
                name: showConversation
            '+showFAQsWith:config:':
                name: showFAQs
            '+showFAQSection:with:config:':
                name: showFAQSection
            '+showSingleFAQ:with:config:':
                name: showSingleFAQ
            '+handleNotificationWithUserInfoDictionary:isAppLaunch:withController:':
                name: handleNotification
            '+showConversationWithConfig:':
                name: showConversation
            '+showFAQsWithConfig:':
                name: showFAQs
            '+showFAQSection:withConfig:':
                name: showFAQSection
            '+showSingleFAQ:withConfig:':
                name: showSingleFAQ
            '+handleNotificationWithUserInfoDictionary:isAppLaunch:':
                name: handleNotification
            '+loginWithIdentity:config:success:failure:':
                name: login
            '+handleForegroundNotification:withCompletionHandler:':
                name: handleForegroundNotification
            '+handleBackgroundNotificationClick:withCompletionHandler:':
                name: handleBackgroundNotificationClick
            '+handleBackgroundNotification:withContentHandler:':
                name: handleBackgroundNotification
            '+handleSilentBackgroundNotification:withCompletionHandler:':
                name: handleSilentBackgroundNotification
protocols:
    HelpshiftDelegate:
        methods:
            '-handleHelpshiftEvent:withData:':
                name: handleHelpshiftEvent
            '-authenticationFailedForUserWithReason:':
                name: authenticationFailed
    HelpshiftProactiveAPIConfigCollectorDelegate: { }
functions:
    # Make sure we don't miss any functions if new ones are introduced in a later version
    (.*):
        class: __FixMe
        name: 'Function_#{g[0]}'

values:
    HelpshiftXVersionString:
        class: HelpshiftSupport
        name: getVersionString
        type: String
        marshaler: StringMarshalers.AsAsciiZMarshaler
    HelpshiftEventName(CSATSubmit):
        class: HelpshiftDelegate
        static_class: EventNames
        type: NSString
        name: '#{g[0]}'
    HelpshiftEventName(.*):
        class: HelpshiftDelegate
        static_class: EventNames
        type: NSString
        name: '#{g[0].downcase_first}'
    HelpshiftEventData(URL):
        class: HelpshiftDelegate
        static_class: EventDataKeys
        type: NSString
        name: '#{g[0]}'
    HelpshiftEventData(.*):
        class: HelpshiftDelegate
        static_class: EventDataKeys
        type: NSString
        name: '#{g[0].downcase_first}'
    HelpshiftEvent(.*):
        class: HelpshiftDelegate
        static_class: Events
        type: NSString
        name: '#{g[0]}'
    HelpshiftUser(.*):
        class: Helpshift
        static_class: UserDetailKeys
        type: NSString
        name: 'user#{g[0]}'

    # Possible failure reasons for user login when using loginWithIdentity: method
    Helpshift(LoginInProgress|LoginConfigInvalid|IdentityTokenInvalid|IdentitiesDataInvalid|LoginConfigSizeLimitExceeded):
        class: Helpshift
        static_class: LoginFailureReasons
        type: NSString
        name: 'user#{g[0]}'
    Helpshift(IdentitiesSizeLimitExceeded|IdentityFeatureNotEnabled|UidOrEmailIsMandatory|IatIsMandatory|NetworkError|UnknownError):
        class: Helpshift
        static_class: LoginFailureReasons
        type: NSString
        name: 'user#{g[0]}'

    # Constants used for errors in user login failure and other identity related events
    Helpshift(LoginConfig|InvalidValueType|InvalidData|KeyLengthLimitExceeded|MetadataKeyLengthLimitExceeded|ValueLengthLimitExceeded|MetadataValueLengthLimitExceeded|EmptyData|MetadataEmptyKeyOrValue|CountLimitExceeded|MetadataCountLimitExceeded):
        class: Helpshift
        static_class: LoginFailureReasons
        type: NSString
        name: 'user#{g[0]}'

    HelpshiftXVersionNumber:
        exclude: true

    # Make sure we don't miss any values if new ones are introduced in a later version
    (.*):
        class: __FixMe
        name: 'Value_#{g[0]}'

constants:

    # Make sure we don't miss any constants if new ones are introduced in a later version
    (.*):
        class: __FixMe
        name: 'Constant__#{g[0]}'
